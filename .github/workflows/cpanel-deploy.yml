name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload .next and trigger flag over FTP
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$LFTP_PASSWORD" ]; then
            echo "Add GitHub secret FTP_PASSWORD (cPanel FTP password)."
            exit 1
          fi
          sudo apt-get update -y
          sudo apt-get install -y lftp
          mkdir -p tmp
          date -Is > tmp/deploy.flag
          lftp -c "
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate no
            set net:max-retries 3
            set net:timeout 30
            set ftp:passive-mode true
            open -u righwail --env-password ftp://198.54.116.49:21
            mkdir -p /rightskills/.next
            mkdir -p /rightskills/tmp
            mirror -R --parallel=4 --delete .next /rightskills/.next
            put tmp/deploy.flag -o /rightskills/tmp/deploy.flag
            bye
          "

      - name: Run server pull + npm install + restart
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL not set; cron will pick up tmp/deploy.flag within a minute."
            exit 0
          fi
          curl -fsS -X POST \
            --max-time 300 \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            "$DEPLOY_HOOK_URL"
        continue-on-error: true
